<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Underground — Club de trabajadores de Metro</title>
<!-- Tailwind por CDN: así usamos las mismas clases del boceto sin
tener que montar un proceso de compilación de CSS aparte. -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html {
    /* Todo el sitio (texto, paddings, radios, iconos con tamaño en rem)
       escala junto con esto: aprox. un 20% más grande que el estándar. */
    font-size: 120%;
  }
  body {
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection {
    background: #0060A9;
    color: #fff;
  }
  /* Scrollbar a juego con la paleta de Metro */
  ::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: #B9C6D2;
    border-radius: 999px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #8FA3B3;
  }
  /* Anillo de foco consistente con la marca, en vez del azul genérico del navegador */
  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible,
  a:focus-visible {
    outline: 2px solid #0060A9;
    outline-offset: 2px;
  }
  /* Micro-interacción sutil en botones y tarjetas clicables, sin tocar cada componente */
  button {
    transition: opacity 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
  }
  button:active {
    transform: scale(0.98);
  }
  /* Las tarjetas blancas con borde ganan una sombra suave para dar profundidad */
  .rounded-xl.border,
  .rounded-2xl.border {
    box-shadow: 0 1px 2px rgba(21, 42, 61, 0.04), 0 1px 3px rgba(21, 42, 61, 0.06);
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
